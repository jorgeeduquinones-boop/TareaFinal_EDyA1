<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funciones recursivas</title>
    <link rel="stylesheet" href="Styles/style.css">
    <script defer src="Scripts/main.js" type="module"></script>
</head>
<body>
    <main>
        <table>
            <caption>Aplicativo para validar funciones recursivas</caption>

            </thead>

                    <td>
                        <select name="" id="laFuncion">

                            <option value="FactR" selected>Factorial R</option><!-- Opción por defecto -->

                            <option value="Deuda">Deuda</option>
                            <option value="GCD" >GCD</option>  
                            <option value="SumaA" >Suma Arreglo</option>                           
                        </select>                           
                    </td>
                    <td></td>
                </tr>
                <tr>
                    <td rowspan="2">Limite1 y Limite2 (ej: 1 o 20,3,8)</td>
                    <td>
                        <input type="text" value="0" name="" id="elParam1"> a                          
                    </td>
                    <td>
                        <input type="text" value="20" name="" id="elParam2">                           
                    </td>
                </tr>                                                   
            </tbody>
        </table>
        <br>
        <fieldset>
            <legend>Funcionalidades</legend> 
            <button id="computar">Computar Calculo</button><br><br>
            <textarea id="salida" cols="64" rows="18" readonly>....</textarea>   
        </fieldset>  
        <hr>
    </main>
    <footer>
        <p> <small>Creado por el profesor Orlando Arboleda, para el curso de EDyA1 en el Universidad Autónomoa de Occidente</small> </p>
    </footer>
